<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Shoot Videos — Nikita Nawal Design Studio</title>
<meta name="description" content="Walkthrough videos of completed interior design projects by Nikita Nawal Design Studio, Indore." />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header id="site-header"></header>

<main>
  <section style="padding-bottom:0; text-align:center;">
    <div class="wrap reveal">
      <h1>Video Gallery</h1>
      <p class="hero-sub" style="margin:0 auto; max-width:52ch;">Project walkthroughs, design process films, and site shoots. Click any thumbnail to play.</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="video-grid reveal" id="videoGrid">
        <div class="skeleton" style="aspect-ratio:16/9;"></div>
        <div class="skeleton" style="aspect-ratio:16/9;"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
document.body.dataset.depth = "0";

function embedIsVideo(url) {
  return url && (url.includes("youtube.com/embed") || url.includes("player.vimeo.com"));
}

async function loadVideos() {
  await initPartials("videos.html");
  const res = await fetch("content/projects.json");
  const projects = (await res.json()).filter((p) => embedIsVideo(p.video_embed_url));
  const grid = document.getElementById("videoGrid");

  if (!projects.length) {
    grid.innerHTML = `<div class="empty-state">No walkthrough videos have been added yet. Add one from the project admin form.</div>`;
    return;
  }

  grid.innerHTML = projects
    .map(
      (p) => `
    <div>
      <div class="video-frame" data-src="${p.video_embed_url}">
        <img src="${p.hero_image}" alt="${p.title} walkthrough preview" loading="lazy" />
        <div class="play-btn"></div>
      </div>
      <span class="project-meta-k" style="margin-top:16px; display:block;">${p.category}</span>
      <a href="project.html?slug=${p.slug}" style="text-decoration:none; color:inherit;">
        <h3 style="margin-top:2px;">${p.title} &mdash; Walkthrough</h3>
      </a>
    </div>`
    )
    .join("");

  grid.querySelectorAll(".video-frame").forEach((frame) => {
    frame.addEventListener("click", () => {
      const src = frame.dataset.src + (frame.dataset.src.includes("?") ? "&" : "?") + "autoplay=1";
      frame.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
    });
  });

  initReveal();
}
loadVideos();
</script>
</body>
</html>
