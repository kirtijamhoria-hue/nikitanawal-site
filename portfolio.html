<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — Nikita Nawal Design Studio</title>
<meta name="description" content="Browse residential and commercial interior design projects by Nikita Nawal Design Studio, Indore." />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header id="site-header"></header>

<main>
  <section style="padding-bottom:0; text-align:center;">
    <div class="wrap reveal">
      <div class="eyebrow-center">OUR WORK</div>
      <h1>Portfolio</h1>
      <p class="hero-sub" style="margin:0 auto; max-width:56ch;">A curated selection of residential, commercial and hospitality projects that reflect our design philosophy.</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="filters filters-category reveal" id="filters"></div>
      <div class="filters filters-style reveal" id="styleFilters"></div>
      <div class="project-grid reveal" id="projectGrid">
        <div class="skeleton" style="aspect-ratio:4/5;"></div>
        <div class="skeleton" style="aspect-ratio:4/5;"></div>
        <div class="skeleton" style="aspect-ratio:4/5;"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
document.body.dataset.depth = "0";

async function loadPortfolio() {
  await initPartials("portfolio.html");
  const res = await fetch("content/projects.json");
  const projects = asProjectList(await res.json()).sort((a, b) => (a.display_order || 0) - (b.display_order || 0));

  const categories = ["All", ...new Set(projects.map((p) => p.category).filter(Boolean))];
  const styles = ["All", ...new Set(projects.map((p) => p.style).filter(Boolean))];

  const filtersEl = document.getElementById("filters");
  const styleFiltersEl = document.getElementById("styleFilters");

  filtersEl.innerHTML = categories
    .map((c, i) => `<button class="filter-btn filter-box ${i === 0 ? "active" : ""}" data-cat="${c}">${c}</button>`)
    .join("");
  styleFiltersEl.innerHTML = styles
    .map((s, i) => `<button class="filter-btn filter-text ${i === 0 ? "active" : ""}" data-style="${s}">${s}</button>`)
    .join("");

  const grid = document.getElementById("projectGrid");
  let activeCat = "All";
  let activeStyle = "All";

  function render() {
    const list = projects.filter(
      (p) => (activeCat === "All" || p.category === activeCat) && (activeStyle === "All" || p.style === activeStyle)
    );
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state">No projects match this combination yet.</div>`;
      return;
    }
    grid.innerHTML = list
      .map(
        (p) => `
      <a class="project-card" href="project.html?slug=${p.slug}">
        <div class="project-thumb"><img src="${p.hero_image}" alt="${p.title}" loading="lazy" /></div>
        <span class="project-meta-k">${p.category} · ${p.style || ""}</span>
        <h3>${p.title}</h3>
      </a>`
      )
      .join("");
  }

  render();

  filtersEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    filtersEl.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    activeCat = btn.dataset.cat;
    render();
  });

  styleFiltersEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    styleFiltersEl.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    activeStyle = btn.dataset.style;
    render();
  });

  initReveal();
}

loadPortfolio();
</script>
</body>
</html>
